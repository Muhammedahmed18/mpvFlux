name: Make release

permissions:
  contents: write

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  release-for-github:
    name: "Release for GitHub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download mpv-android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            --output app/libs/mpv-android-lib-v1.1.0.aar \
            "https://github.com/MpvFlux/mpv-android/releases/download/v1.1.0/mpv-android-lib-v1.1.0.aar"
          unzip -t app/libs/mpv-android-lib-v1.1.0.aar

      - name: Build release with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Unsupported release tag: $RELEASE_TAG"
              exit 1
            fi
            echo "VERSION_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          else
            echo "VERSION_TAG=signing-test" >> "$GITHUB_ENV"
          fi

      - name: Verify build output
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory does not exist!"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi
          echo "Release APKs:"
          ls -lah "$RELEASE_DIR"

      - name: Sign APKs
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/apk/release"

          echo "${{ secrets.SIGNING_KEYSTORE }}" | base64 -d > release.keystore

          APK_COUNT=$(find "$RELEASE_DIR" -name "app-*-release-unsigned.apk" -type f | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No unsigned APK files found"
            ls -lah "$RELEASE_DIR"
            rm release.keystore
            exit 1
          fi

          find "$RELEASE_DIR" -name "app-*-release-unsigned.apk" -type f | while read -r apk; do
            signed_apk="${apk/-unsigned/}"

            $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed_apk" \
              "$apk"

            $ANDROID_HOME/build-tools/34.0.0/apksigner verify "$signed_apk"
            rm "$apk"
          done

          rm release.keystore
          echo "Signed APKs:"
          ls -lh "$RELEASE_DIR"/app-*-release.apk

      - name: Copy build artifacts
        run: |
          set -euo pipefail

          abis=("universal" "arm64-v8a" "armeabi-v7a" "x86" "x86_64")
          for abi in "${abis[@]}"; do
            src="app/build/outputs/apk/release/app-${abi}-release.apk"
            dst="mpvFlux-${abi}-${VERSION_TAG}.apk"
            if [ ! -f "$src" ]; then
              echo "::error file=$src::Signed APK for $abi was not found"
              exit 1
            fi
            cp "$src" "$dst"
            checksum=$(sha256sum "$dst" | awk '{ print $1 }')
            varname="apk_${abi//-/_}_sha256"
            echo "$varname=$checksum" >> "$GITHUB_ENV"
          done

          ls -lah mpvFlux-*.apk

      - name: Upload APKs to published GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION_TAG" mpvFlux-*.apk --clobber
          echo "Uploaded five signed APKs to $VERSION_TAG."

      - name: Upload manual test APKs as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mpvFlux-signing-test
          path: mpvFlux-*.apk
          retention-days: 1
